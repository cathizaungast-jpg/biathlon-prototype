<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Stehendanschlag – Prototyp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f6f6f6;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: 100svh;
    }

    /* ── Phone shell ─────────────────────────────────────────── */
    .phone {
      position: absolute;
      width: 390px; height: 844px;
      overflow: hidden;
      background: #f6f6f6;
      /* default: centered (desktop). overridden by fitPhone() */
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      transform-origin: center center;
    }

    /* ── Rotation image ──────────────────────────────────────── */
    #rot-img {
      position: absolute;
      inset: 0;
      width: 390px; height: 844px;
      object-fit: fill;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ── Spots layer ─────────────────────────────────────────── */
    .spots-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .spots-layer.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .spot {
      position: absolute;
      width: 44px; height: 44px;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .spot-svg {
      width: 28px; height: 28px;
      pointer-events: none;
      overflow: visible;
    }
    /* Pulse on the outer ring when visible */
    .spots-layer.visible .spot-svg {
      animation: spotPulse 2.2s ease-in-out infinite;
    }
    @keyframes spotPulse {
      0%,100% { filter: drop-shadow(0 0 3px rgba(26,103,182,0.35)); }
      50%      { filter: drop-shadow(0 0 9px rgba(26,103,182,0.6));  }
    }

    /* ── HTML Slider — Figma position: top 730px, left 45px, right 51px, h 44px ── */
    .slider-bar {
      position: absolute;
      top: 730px;
      left: 45px; right: 51px;
      height: 44px;
      border-radius: 15px;
      background: rgba(237,237,237,0.97);
      border: 1px solid #b4b9c1;
      box-shadow: 0 0 2px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      padding: 0 14px;
      touch-action: none;
      user-select: none;
      z-index: 20;
      cursor: grab;
      gap: 0;
    }
    .slider-bar:active { cursor: grabbing; }

    .arrow-btn {
      width: 32px; height: 100%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }
    .arrow-icon { width: 20px; height: 14px; }

    .slider-track {
      flex: 1;
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
    }
    .slider-thumb {
      position: absolute;
      top: 50%;
      left: 0%;                        /* initial: left = frame 1 */
      transform: translate(-50%, -50%);
      width: 14px; height: 14px;
      background: #2c2c2c;
      border-radius: 50%;
      pointer-events: none;
      transition: left 0.05s linear;
    }

    /* ── Closeup layers — slide in from right ────────────────── */
    .closeup-layer {
      position: absolute;
      inset: 0;
      z-index: 30;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      pointer-events: none;
    }
    .closeup-layer.visible {
      transform: translateX(0);
      pointer-events: auto;
    }
    .closeup-layer > img {
      width: 100%; height: 100%;
      display: block;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    /* ── Text slide layers — slide up from bottom ────────────── */
    .text-layer {
      position: absolute;
      inset: 0;
      z-index: 35;
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.32s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .text-layer > img {
      width: 100%; height: 100%;
      display: block;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    /* Peeking: subtle nudge from below */
    .text-layer.peeking {
      opacity: 1;
      transform: translateY(calc(100% - 28px));
      animation: textPeek 2s ease-in-out infinite;
      transition: none;
      pointer-events: auto;
    }
    .text-layer.peeking::before {
      content: '';
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      width: 44px; height: 5px;
      background: #2A6192;
      border-radius: 3px;
      opacity: 0.85;
      z-index: 2;
    }
    @keyframes textPeek {
      0%,100% { transform: translateY(calc(100% - 28px)); }
      50%      { transform: translateY(calc(100% - 52px)); }
    }

    /* Fully visible (first reveal: slide up) */
    .text-layer.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      animation: none;
    }

    /* "mehr" tap zone — Figma: "mehr" text at y≈728-748, center y≈738 */
    .mehr-btn {
      position: absolute;
      top: 712px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px; height: 56px;
      z-index: 3;
      cursor: pointer;
    }

    /* ── Detail layers — slide in from right ─────────────────── */
    .detail-layer {
      position: absolute;
      inset: 0;
      z-index: 40;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      pointer-events: none;
      background: #f6f6f6;
    }
    .detail-layer.visible {
      transform: translateX(0);
      pointer-events: auto;
    }

    /* Fixed head inside detail */
    .detail-head {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 120px;
      background: rgba(246,246,246,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 5;
      pointer-events: none;
    }
    .detail-head-inner {
      position: absolute;
      top: 79px; left: 12px; right: 12px;
      height: 44px;
      display: flex; align-items: center;
    }
    .detail-head-back {
      width: 44px; height: 44px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: flex-start;
    }
    .detail-head-title {
      flex: 1;
      font-family: 'Neue Haas Unica W1G', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 500; font-size: 16px; line-height: 1;
      color: #2c2c2c; text-align: center;
    }
    .detail-head-target {
      width: 44px; height: 44px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: flex-end;
    }

    .detail-scroll {
      width: 100%; height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .detail-img-wrap { position: relative; width: 100%; }
    .detail-img-wrap > img { width: 100%; height: auto; display: block; }

    .zurück-tap {
      position: absolute;
      bottom: 26px; left: 50%;
      transform: translateX(-50%);
      width: 150px; height: 66px;
      cursor: pointer; z-index: 2;
    }

    /* ── Overlay head (closeup + text slide states) ─────────── */
    /* Covers the semi-transparent "Blur oben" in the Figma closeup images
       so the dreh hamburger can't bleed through. Shows back arrow instead. */
    .overlay-head {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 130px;
      background: rgba(246,246,246,0.97);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 36;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease;
    }
    .overlay-head.visible { opacity: 1; }
    .overlay-head-inner {
      position: absolute;
      top: 88px; left: 12px; right: 12px;
      height: 44px;
      display: flex; align-items: center;
    }
    .overlay-head-icon {
      width: 44px; height: 44px;
      display: flex; align-items: center;
      flex-shrink: 0;
    }
    .overlay-head-icon.right { justify-content: flex-end; }
    .overlay-head-title {
      flex: 1;
      text-align: center;
      font-family: 'Neue Haas Unica W1G', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 500; font-size: 16px;
      color: #2c2c2c;
    }

    /* ── Invisible header tap zones (always on top) ──────────── */
    .header-btn {
      position: absolute;
      top: 79px;
      width: 44px; height: 44px;
      z-index: 50;
      cursor: pointer;
    }
    #btnMenu   { left: 12px; }
    #btnTarget { right: 12px; }
  </style>
</head>
<body>
<div class="phone" id="phone">

<script>
// ═══════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════
const TOTAL      = 29;
const SPOT_DELAY = 400;   // ms after drag stop before spots appear
const PEEK_DELAY = 700;   // ms after closeup open before peek starts

// Closeup → how many text slides
const TEXT_COUNTS = { 'f1-1': 3, 'f1-2': 1, 'f1-3': 3, 'f10-1': 3 };

// Only the two nav frames designed in Figma (nav-f1_S and nav-f10_S)
function navLayerForFrame(n) {
  if (n === 1)  return 'spots-f1';
  if (n === 10) return 'spots-f10';
  return null;
}

// Titles for the overlay head (from Figma Head_S text)
const CLOSEUP_TITLES = {
  'f1-1':  'Beine und Füsse',
  'f1-2':  'Hüfte',
  'f1-3':  'Arme',
  'f10-1': 'Beine und Füsse',
};

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const phone      = document.getElementById('phone');
const rotImg     = document.getElementById('rot-img');
const sliderBar  = document.getElementById('sliderBar');
const sliderTrack= document.getElementById('sliderTrack');
const thumb      = document.getElementById('sliderThumb');

let currentFrame    = 1;
let dragging        = false;
let dragStartX      = 0;
let dragStartFrame  = 1;
let spotTimer       = null;
let peekTimer       = null;
let activeCloseupId = null;   // e.g. 'f1-1'
let activeTextIdx   = -1;     // -1 = no text slide open
let activeDetailId  = null;

// ═══════════════════════════════════════════════════════════
//  FRAME / SLIDER
// ═══════════════════════════════════════════════════════════
function showFrame(n) {
  n = Math.max(1, Math.min(TOTAL, Math.round(n)));
  if (n === currentFrame) return;
  currentFrame = n;
  rotImg.src = `images/dreh-f${n}.png`;
  // Thumb: 0% at frame 1, 100% at frame 29
  thumb.style.left = ((n - 1) / (TOTAL - 1) * 100) + '%';
}

// ═══════════════════════════════════════════════════════════
//  SPOTS
// ═══════════════════════════════════════════════════════════
function hideSpots() {
  clearTimeout(spotTimer);
  document.querySelectorAll('.spots-layer').forEach(l => l.classList.remove('visible'));
}
function scheduleSpots() {
  clearTimeout(spotTimer);
  const id = navLayerForFrame(currentFrame);
  if (id) spotTimer = setTimeout(() => document.getElementById(id).classList.add('visible'), SPOT_DELAY);
}

// ═══════════════════════════════════════════════════════════
//  TEXT SLIDES
// ═══════════════════════════════════════════════════════════
function textEl(closeupId, idx) {
  return document.getElementById(`text-${closeupId}-${idx}`);
}

function startPeek(closeupId) {
  clearTimeout(peekTimer);
  if (!TEXT_COUNTS[closeupId]) return;
  peekTimer = setTimeout(() => {
    if (activeCloseupId === closeupId && activeTextIdx === -1)
      textEl(closeupId, 0)?.classList.add('peeking');
  }, PEEK_DELAY);
}
function stopPeek(closeupId) {
  clearTimeout(peekTimer);
  textEl(closeupId, 0)?.classList.remove('peeking');
}

function showTextSlide(closeupId, idx) {
  stopPeek(closeupId);
  const incoming = textEl(closeupId, idx);
  if (!incoming) return;

  if (activeTextIdx >= 0 && activeTextIdx !== idx) {
    // ── Slide-to-slide: smooth crossfade (no translateY) ──
    const outgoing = textEl(closeupId, activeTextIdx);
    const DUR = '0.16s';

    // Fade out current
    if (outgoing) {
      outgoing.style.cssText = `transition: opacity ${DUR} ease; opacity: 0;`;
      setTimeout(() => {
        outgoing.classList.remove('visible', 'peeking');
        outgoing.style.cssText = '';
      }, 170);
    }

    // Position incoming at y=0 invisible, then fade in
    incoming.classList.remove('peeking');
    incoming.style.cssText = 'transform: translateY(0); opacity: 0; transition: none; pointer-events: none;';
    void incoming.offsetWidth;
    incoming.style.cssText = `transform: translateY(0); opacity: 1; transition: opacity ${DUR} ease; pointer-events: auto;`;
    setTimeout(() => {
      incoming.classList.add('visible');
      incoming.style.cssText = '';
    }, 170);

  } else {
    // ── First reveal from closeup: slide up from bottom ──
    if (activeTextIdx >= 0) textEl(closeupId, activeTextIdx)?.classList.remove('visible', 'peeking');
    incoming.classList.remove('peeking');
    void incoming.offsetWidth;
    incoming.classList.add('visible');
  }

  activeTextIdx = idx;
}

function resetTextSlides(closeupId) {
  clearTimeout(peekTimer);
  const count = TEXT_COUNTS[closeupId] || 0;
  for (let i = 0; i < count; i++) {
    const el = textEl(closeupId, i);
    if (el) { el.classList.remove('visible', 'peeking'); el.style.transform = ''; }
  }
  activeTextIdx = -1;
}

// ═══════════════════════════════════════════════════════════
//  DETAIL
// ═══════════════════════════════════════════════════════════
function openDetail(detailId) {
  const layer = document.getElementById(`detail-${detailId}`);
  if (!layer) return;
  activeDetailId = detailId;
  layer.classList.add('visible');
  // Skip Figma header (≈120px) in the image
  const scroll = document.getElementById(`dscroll-${detailId}`);
  if (scroll) { scroll.scrollTop = 0; setTimeout(() => { scroll.scrollTop = 120; }, 60); }
}

function dismissDetail() {
  if (!activeDetailId) return;
  const layer = document.getElementById(`detail-${activeDetailId}`);
  const scroll = document.getElementById(`dscroll-${activeDetailId}`);
  if (layer) layer.classList.remove('visible');
  if (scroll) setTimeout(() => { scroll.scrollTop = 0; }, 350);
  activeDetailId = null;
}

// ═══════════════════════════════════════════════════════════
//  CLOSEUP
// ═══════════════════════════════════════════════════════════
function openCloseup(id) {
  hideSpots();
  activeCloseupId = id;
  activeTextIdx   = -1;
  document.getElementById(`closeup-${id}`)?.classList.add('visible');
  // Show overlay head with back arrow + title
  document.getElementById('overlayTitle').textContent = CLOSEUP_TITLES[id] || '';
  document.getElementById('overlayHead').classList.add('visible');
  startPeek(id);
}

function dismissAllCloseups() {
  document.querySelectorAll('.text-layer').forEach(t => {
    t.classList.remove('visible', 'peeking');
    t.style.cssText = '';
  });
  clearTimeout(peekTimer);
  activeTextIdx   = -1;
  activeCloseupId = null;
  document.querySelectorAll('.closeup-layer').forEach(l => l.classList.remove('visible'));
  document.getElementById('overlayHead').classList.remove('visible');
  scheduleSpots();
}

// ═══════════════════════════════════════════════════════════
//  SLIDER EVENTS
// ═══════════════════════════════════════════════════════════
sliderBar.addEventListener('pointerdown', e => {
  dragging       = true;
  dragStartX     = e.clientX;
  dragStartFrame = currentFrame;
  sliderBar.setPointerCapture(e.pointerId);
  hideSpots();
  thumb.style.transition = 'none';
  e.preventDefault();
});
sliderBar.addEventListener('pointermove', e => {
  if (!dragging) return;
  const tw    = sliderTrack.getBoundingClientRect().width;
  const delta = (e.clientX - dragStartX) / tw * (TOTAL - 1);
  showFrame(dragStartFrame + delta);
});
sliderBar.addEventListener('pointerup', () => {
  dragging = false;
  thumb.style.transition = '';
  scheduleSpots();
});
sliderBar.addEventListener('pointercancel', () => {
  dragging = false;
  thumb.style.transition = '';
  scheduleSpots();
});

// Arrow buttons
document.getElementById('btnLeft').addEventListener('click', e => {
  e.stopPropagation(); hideSpots(); showFrame(currentFrame - 1); scheduleSpots();
});
document.getElementById('btnRight').addEventListener('click', e => {
  e.stopPropagation(); hideSpots(); showFrame(currentFrame + 1); scheduleSpots();
});

// ═══════════════════════════════════════════════════════════
//  SPOT TAPS
// ═══════════════════════════════════════════════════════════
document.querySelectorAll('.spot[data-closeup]').forEach(spot => {
  spot.addEventListener('click', () => openCloseup(spot.dataset.closeup));
});

// ═══════════════════════════════════════════════════════════
//  MEHR BUTTON
// ═══════════════════════════════════════════════════════════
document.querySelectorAll('.mehr-btn').forEach(btn => {
  btn.addEventListener('click', e => { e.stopPropagation(); openDetail(btn.dataset.detail); });
});

// ═══════════════════════════════════════════════════════════
//  HEADER BUTTONS (z-50, always on top)
// ═══════════════════════════════════════════════════════════
document.getElementById('btnTarget').addEventListener('click', () => {
  dismissDetail();
  dismissAllCloseups();
});
document.getElementById('btnMenu').addEventListener('click', () => {
  if (activeDetailId)                               dismissDetail();
  else if (activeTextIdx >= 0 && activeCloseupId) { resetTextSlides(activeCloseupId); startPeek(activeCloseupId); }
  else if (activeCloseupId)                         dismissAllCloseups();
});

// ═══════════════════════════════════════════════════════════
//  CLOSEUP GESTURES — swipe up → text, pull down → dismiss
// ═══════════════════════════════════════════════════════════
const PULL_ZONE      = 80;   // px from top where pull-down activates
const PULL_THRESHOLD = 90;   // px needed to confirm dismiss
const SWIPE_UP_THR   = 30;   // px upward needed to reveal first text slide

document.querySelectorAll('.closeup-layer').forEach(layer => {
  let startY = 0, gesture = null;

  layer.addEventListener('pointerdown', e => {
    startY  = e.clientY;
    gesture = null;
    layer.setPointerCapture(e.pointerId);
  });

  layer.addEventListener('pointermove', e => {
    const scale  = phone.getBoundingClientRect().width / 390;
    const dy     = (e.clientY - startY) / scale;
    if (gesture === null && Math.abs(dy) > 8) {
      const relY = (startY - layer.getBoundingClientRect().top) / scale;
      if (e.pointerType !== 'mouse' && relY <= PULL_ZONE && dy > 0) {
        gesture = 'pull'; layer.classList.add('swiping');
      } else {
        gesture = dy < 0 ? 'swipeup' : 'none';
      }
    }
    if (gesture === 'pull' && dy > 0)
      layer.style.transform = `translateX(0) translateY(${dy * scale}px)`;
  });

  layer.addEventListener('pointerup', e => {
    const scale = phone.getBoundingClientRect().width / 390;
    const dy    = (e.clientY - startY) / scale;
    if (gesture === 'pull') {
      layer.classList.remove('swiping');
      if (dy > PULL_THRESHOLD) {
        const cid = layer.id.replace('closeup-', '');
        layer.style.transition = 'transform 0.32s cubic-bezier(0.25,0.46,0.45,0.94)';
        layer.style.transform  = `translateY(${844 * scale}px)`;
        setTimeout(() => {
          layer.classList.remove('visible');
          layer.style.transform  = '';
          layer.style.transition = '';
          resetTextSlides(cid);
          activeCloseupId = null;
          scheduleSpots();
        }, 340);
      } else {
        layer.style.transform = '';
      }
    } else if (gesture === 'swipeup' && dy < -SWIPE_UP_THR) {
      const cid = layer.id.replace('closeup-', '');
      if (TEXT_COUNTS[cid] && activeTextIdx === -1) showTextSlide(cid, 0);
    }
    gesture = null;
  });

  layer.addEventListener('pointercancel', () => {
    if (gesture === 'pull') { layer.classList.remove('swiping'); layer.style.transform = ''; }
    gesture = null;
  });
});

// ═══════════════════════════════════════════════════════════
//  TEXT SLIDE TAPS — tap to advance (circular)
// ═══════════════════════════════════════════════════════════
document.querySelectorAll('.text-layer').forEach(layer => {
  layer.addEventListener('click', e => {
    if (e.target.closest('.mehr-btn')) return;
    const cid   = layer.dataset.closeup;
    const idx   = parseInt(layer.dataset.idx);
    const count = TEXT_COUNTS[cid] || 1;
    if (layer.classList.contains('peeking')) { showTextSlide(cid, 0); return; }
    showTextSlide(cid, (idx + 1) % count);
  });
});

// ═══════════════════════════════════════════════════════════
//  ZURÜCK — back to rotation from detail
// ═══════════════════════════════════════════════════════════
document.querySelectorAll('.zurück-tap').forEach(tap => {
  tap.addEventListener('click', e => { e.stopPropagation(); dismissDetail(); dismissAllCloseups(); });
});

// ═══════════════════════════════════════════════════════════
//  PRELOAD
// ═══════════════════════════════════════════════════════════
(function preload() {
  for (let i = 1; i <= TOTAL; i++) new Image().src = `images/dreh-f${i}.png`;
})();

// ═══════════════════════════════════════════════════════════
//  FIT PHONE TO VIEWPORT
//  Mobile (≤500px wide): scale by width, pin to top-left → no black bars
//  Desktop: fit inside viewport, never exceed 1× scale
// ═══════════════════════════════════════════════════════════
function fitPhone() {
  if (window.innerWidth <= 500) {
    const s = window.innerWidth / 390;
    phone.style.top            = '0';
    phone.style.left           = '0';
    phone.style.transformOrigin = 'top left';
    phone.style.transform      = `scale(${s})`;
  } else {
    const s = Math.min(window.innerWidth / 390, window.innerHeight / 844, 1);
    phone.style.top            = '50%';
    phone.style.left           = '50%';
    phone.style.transformOrigin = 'center center';
    phone.style.transform      = `translate(-50%, -50%) scale(${s})`;
  }
}
fitPhone();
window.addEventListener('resize', fitPhone);

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
scheduleSpots();
</script>
</body>
</html>
